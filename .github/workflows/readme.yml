name: AI Translate README

on:
  push:
    paths:
      - 'README_CN.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Stable Library
        # 回退到兼容性最好的旧版 SDK
        run: pip install -q -U google-generativeai

      - name: AI Translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<EOF
          import os
          import sys
          import time
          import google.generativeai as genai
          from google.api_core import exceptions

          # 配置 API
          api_key = os.environ.get('GEMINI_API_KEY')
          if not api_key:
              print("Error: GEMINI_API_KEY missing.")
              sys.exit(1)
          
          genai.configure(api_key=api_key)

          # 读取文件
          if not os.path.exists('README_CN.md'):
              print("Error: README_CN.md not found.")
              sys.exit(1)
          
          with open('README_CN.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # 定义模型尝试列表 (优先使用 Flash，备用 Pro)
          # 注意：在旧版 SDK 中，模型名称通常不需要带版本号后缀
          models_to_try = ['gemini-1.5-flash', 'gemini-1.5-pro', 'gemini-pro']
          
          prompt = f"Translate the following Markdown to English. Keep all formatting, links, and code blocks unchanged. Output only the translated text:\n\n{content}"

          success = False

          for model_name in models_to_try:
              print(f"Testing model: {model_name}...")
              try:
                  model = genai.GenerativeModel(model_name)
                  response = model.generate_content(prompt)
          
                  if response.text:
                      with open('README.md', 'w', encoding='utf-8') as f:
                          f.write(response.text)
                      print(f"Success! Translated using {model_name}")
                      success = True
                      break
          
              except exceptions.ResourceExhausted:
                  print(f"Rate limit hit for {model_name}. Sleeping for 20s...")
                  time.sleep(20) # 遇到 429 等待 20秒
                  try:
                      print("Retrying...")
                      response = model.generate_content(prompt)
                      with open('README.md', 'w', encoding='utf-8') as f:
                          f.write(response.text)
                      success = True
                      break
                  except Exception as e:
                       print(f"Retry failed: {e}")

              except Exception as e:
                  print(f"Failed with {model_name}: {e}")
                  continue

          if not success:
              print("All attempts failed.")
              sys.exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m 'docs: AI Auto-translate README_CN to README'
            git push
          fi