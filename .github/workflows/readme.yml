name: AI Translate README

on:
  push:
    paths:
      - 'README_CN.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 注意：这里不需要 pip install 任何东西，直接用原生 Python

      - name: AI Translation (Raw HTTP)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<EOF
          import os
          import sys
          import json
          import time
          import urllib.request
          import urllib.error

          api_key = os.environ.get('GEMINI_API_KEY')
          if not api_key:
              print("Error: GEMINI_API_KEY is missing.")
              sys.exit(1)

          if not os.path.exists('README_CN.md'):
              print("Error: README_CN.md not found.")
              sys.exit(1)

          with open('README_CN.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # 构造 Prompt
          payload = {
              "contents": [{
                  "parts": [{"text": "Translate the following Markdown to English. Keep all formatting, links, and code blocks unchanged. Output ONLY the translated text:\n\n" + content}]
              }]
          }
          data = json.dumps(payload).encode('utf-8')

          # 候选模型列表：根据日志，优先尝试 2.0 (虽然之前报 429，但说明它存在)
          models = [
              "gemini-2.0-flash-exp",
              "gemini-1.5-flash",
              "gemini-1.5-flash-latest",
              "gemini-1.5-pro"
          ]

          success = False

          for model in models:
              print(f"--- Trying model: {model} ---")
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={api_key}"
              req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})

              # 针对 429 (Rate Limit) 的重试循环
              max_retries = 3
              for attempt in range(max_retries):
                  try:
                      with urllib.request.urlopen(req) as response:
                          result = json.loads(response.read().decode('utf-8'))
          
                          # 解析响应
                          try:
                              translated_text = result['candidates'][0]['content']['parts'][0]['text']
                              with open('README.md', 'w', encoding='utf-8') as f:
                                  f.write(translated_text)
                              print(f"Success! Translated using {model}.")
                              success = True
                              break # 跳出重试循环
                          except (KeyError, IndexError) as e:
                              print(f"Error parsing response: {result}")
                              break # 格式不对，换下一个模型
          
                  except urllib.error.HTTPError as e:
                      if e.code == 429:
                          print(f"Rate limit hit (429). Waiting 30 seconds... (Attempt {attempt+1}/{max_retries})")
                          time.sleep(30) # 强制休眠 30 秒
                          continue # 重试当前模型
                      elif e.code == 404:
                          print(f"Model not found (404): {model}")
                          break # 换下一个模型
                      else:
                          print(f"HTTP Error {e.code}: {e.read().decode('utf-8')}")
                          break # 其他错误，换下一个模型
                  except Exception as e:
                      print(f"Unknown error: {e}")
                      break

              if success:
                  break # 任务完成，跳出模型循环

          if not success:
              print("All models failed.")
              sys.exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m 'docs: AI Auto-translate README_CN to README'
            git push
          fi