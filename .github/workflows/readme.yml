name: AI Translate README

on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install New AI Library
        # 切换到最新的 google-genai 库
        run: pip install -q -U google-genai

      - name: AI Translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<EOF
          import os
          from genai import Client

          # 初始化最新的客户端
          client = Client(api_key=os.environ['GEMINI_API_KEY'])
          
          # 建议使用 gemini-1.5-flash，速度快且完全满足翻译需求
          model_id = "gemini-1.5-flash"

          # 读取中文 README
          if not os.path.exists('README_CN.md'):
              print("Error: README_CN.md not found")
              exit(1)
          
          with open('README_CN.md', 'r', encoding='utf-8') as f:
              content = f.read()

          prompt = f"Translate the following Markdown content to English. Keep Markdown syntax, links, and code blocks unchanged. Output only the translated text:\n\n{content}"
          
          # 调用最新 API
          response = client.models.generate_content(
              model=model_id,
              contents=prompt
          )
          
          # 写入英文 README
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(response.text)
          EOF

      - name: Commit and Push
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'docs: AI Auto-translate README_CN to README'
            git push
          fi