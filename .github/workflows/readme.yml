name: AI Translate README

on:
  push:
    paths:
      - 'README_CN.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Google GenAI Library
        # 1. 确保安装的是这个新库
        run: pip install -U google-genai

      - name: AI Translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<EOF
          import os
          import sys
          
          # 2. 核心修正：必须从 google 命名空间导入
          try:
              from google import genai
          except ImportError:
              print("Critical Error: Could not import 'google.genai'.")
              sys.exit(1)

          # 初始化客户端
          api_key = os.environ.get('GEMINI_API_KEY')
          if not api_key:
              print("Error: GEMINI_API_KEY is missing.")
              sys.exit(1)
          
          client = genai.Client(api_key=api_key)
          
          # 读取文件
          if not os.path.exists('README_CN.md'):
              print("Error: README_CN.md file not found.")
              sys.exit(1)
          
          with open('README_CN.md', 'r', encoding='utf-8') as f:
              content = f.read()

          print(f"Translating {len(content)} characters...")

          # 3. 调用 API (使用 flash 模型)
          try:
              response = client.models.generate_content(
                  model="gemini-1.5-flash",
                  contents=f"Translate the following Markdown to English. Keep all formatting/links/code unchanged:\n\n{content}"
              )
          
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(response.text)
              print("Success: README.md updated.")
          
          except Exception as e:
              print(f"API Error: {e}")
              sys.exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m 'docs: AI Auto-translate README_CN to README'
            git push
          fi