name: AI Translate README

on:
  push:
    paths:
      - 'README_CN.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Google GenAI Library
        run: pip install -U google-genai

      - name: AI Translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<EOF
          import os
          import sys
          
          # 导入 Google GenAI SDK
          try:
              from google import genai
              from google.genai import types
          except ImportError:
              print("Critical Error: Failed to import google.genai")
              sys.exit(1)

          api_key = os.environ.get('GEMINI_API_KEY')
          if not api_key:
              print("Error: GEMINI_API_KEY not found.")
              sys.exit(1)

          client = genai.Client(api_key=api_key)

          # 读取中文文件
          if not os.path.exists('README_CN.md'):
              print("Error: README_CN.md not found.")
              sys.exit(1)

          with open('README_CN.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # --- 核心改进：模型重试列表 ---
          # 如果别名(alias)失败，就尝试具体版本号(versioned)，如果Flash失败，就尝试Pro
          candidate_models = [
              "gemini-1.5-flash", 
              "gemini-1.5-flash-001", 
              "gemini-1.5-pro",
              "gemini-1.5-pro-001",
              "gemini-2.0-flash-exp" # 最新的实验版
          ]

          prompt_text = f"Translate the following Markdown to English. Keep all formatting, links, and code blocks unchanged. Output only the translated text:\n\n{content}"
          
          translation_success = False

          for model_id in candidate_models:
              print(f"Trying model: {model_id} ...")
              try:
                  response = client.models.generate_content(
                      model=model_id,
                      contents=prompt_text
                  )
          
                  if response.text:
                      with open('README.md', 'w', encoding='utf-8') as f:
                          f.write(response.text)
                      print(f"Success! Translated using {model_id}.")
                      translation_success = True
                      break # 成功则跳出循环
              except Exception as e:
                  print(f"Failed with {model_id}: {e}")
                  continue # 失败则尝试下一个

          if not translation_success:
              print("All models failed.")
              sys.exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m 'docs: AI Auto-translate README_CN to README'
            git push
          fi