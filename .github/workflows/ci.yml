name: CI

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 安装 liburing 依赖
      # 这是为了让你的 EnvironmentCheckTest 能在 Ubuntu 上通过
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      # 2. 配置标准 JDK 25
      # Temurin 版本只包含 JVM，不包含 native-image 工具，所以后面必须跳过 native 测试
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 3. 核心修改：构建并测试，但跳过 Native Image 相关任务
      # -DskipNativeTests 会告诉 native-maven-plugin 不要执行 native:test
      - name: Build and Test
        run: mvn -B clean verify -DskipNativeTests

      # 4. 防止 SpotBugs 找不到排除文件报错
      - name: Ensure SpotBugs excludes file
        run: |
          if [ ! -f spotbugs-excludes.xml ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?><FindBugsFilter></FindBugsFilter>' > spotbugs-excludes.xml
          fi

      # 5. 运行代码静态分析
      - name: SpotBugs analysis
        run: mvn spotbugs:check -Dspotbugs.failOnError=true