name: CI

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🔴 关键修改：将环境切换为 JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          # 如果 temurin 报错找不到 25，可以尝试改为 'zulu' 或 'oracle'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Test
        run: mvn -B clean verify

      # 创建排除文件（防止 SpotBugs 找不到文件报错）
      - name: Ensure SpotBugs excludes file
        run: |
          if [ ! -f spotbugs-excludes.xml ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?><FindBugsFilter></FindBugsFilter>' > spotbugs-excludes.xml
          fi

      # 单独运行检查，确保能看到显式的报错
      - name: SpotBugs analysis
        run: mvn spotbugs:check -Dspotbugs.failOnError=true