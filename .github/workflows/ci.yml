name: CI

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 安装 liburing 依赖
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      # 2. 配置标准 JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 3. 创建 SpotBugs 排除规则文件
      # 同时屏蔽：
      # - DMI_HARDCODED_ABSOLUTE_FILENAME (硬编码路径)
      # - CT_CONSTRUCTOR_THROW (构造函数抛出异常)
      - name: Create SpotBugs excludes file
        run: |
          cat <<EOF > spotbugs-excludes.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <FindBugsFilter>
              <Match>
                  <Bug pattern="DMI_HARDCODED_ABSOLUTE_FILENAME"/>
              </Match>
              <Match>
                  <Bug pattern="CT_CONSTRUCTOR_THROW"/>
              </Match>
          </FindBugsFilter>
          EOF

      # 4. 构建并测试
      # 务必保留 -Dspotbugs.excludeFilterFile 参数
      - name: Build and Test
        run: mvn -B clean verify -DskipNativeTests -Dspotbugs.excludeFilterFile=spotbugs-excludes.xml