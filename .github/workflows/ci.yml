name: CI

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 安装 liburing 依赖
      # 这是为了让 EnvironmentCheckTest (依赖 FFM/io_uring) 能在 Ubuntu 上通过
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      # 2. 配置标准 JDK 25
      # Temurin 是目前对新版本支持较好的发行版
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 3. [关键] 预先创建 SpotBugs 排除文件
      # 必须在 mvn verify 之前执行，否则 SpotBugs 启动时找不到文件会报错
      - name: Ensure SpotBugs excludes file
        run: |
          if [ ! -f spotbugs-excludes.xml ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?><FindBugsFilter></FindBugsFilter>' > spotbugs-excludes.xml
          fi

      # 4. 构建、测试并进行静态分析
      # -B: 批处理模式 (减少日志干扰)
      # verify: 会自动触发绑定的 spotbugs:check
      # -DskipNativeTests: 跳过 GraalVM 原生测试 (因为只有 JDK 环境)
      # 注意：这里不再需要 -Dspotbugs.skip=true，因为我们已经在 POM 里升级了 ASM 9.9.1
      - name: Build and Test
        run: mvn -B clean verify -DskipNativeTests